[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeoff-linuxone"
version = "0.1.0"
description = "Restricted-information shortage coordination with bounded LLM tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tradeoff = "tradeoff.cli:main"

[tool.setuptools.package-data]
tradeoff = ["web/*"]

[tool.setuptools.packages.find]
include = ["tradeoff*"]
